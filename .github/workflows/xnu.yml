name: riva-xnu-build

# Build Apple's XNU (iOS 16-era, xnu-8796) for the Redmi 5A / riva
# (MSM8917-8940, Cortex-A53, GICv2, eMMC) by adapting ios-sweet's pipeline.
#
# WHY THIS WORKS: the heavy lifting (fetching the exact xnu source, generating
# config headers, running mig/iig, compiling with Xcode's LLVM) is done by the
# `blacktop/darwin-xnu-build` toolchain at a PINNED commit, on `macos-14`
# (Xcode 15's iig ABI matches xnu-8796). We reuse that core untouched. What we
# contribute is ONLY the patch series in `xnu/patches/` — the actual riva
# port. This is the same architecture ios-sweet uses.
#
# To use: push this repo to GitHub, then `gh workflow run riva-xnu-build.yml`.
# Uploaded artifacts:
#   xnu-kernel     -> kernel (Mach-O) + config, ready for tools/mkpayload-riva.py
#   xnu-buildtree  -> generated headers + patched source to re-run single
#                     compile commands locally (ios-sweet's dev loop).

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (must exist under xnu/config/)
        default: RIVA
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - ".github/workflows/riva-xnu-build.yml"

concurrency:
  group: riva-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  # Pin the same toolchain commit ios-sweet is known to work with.
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'RIVA' }}

jobs:
  build:
    # Xcode 15.x on macos-14: its iig matches the xnu-8796 IORPC ABI.
    # Do NOT move to macos-15 (Xcode 16) without re-checking iig output.
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Fetch the xnu build toolchain (blacktop/darwin-xnu-build)
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          echo "dxb pinned to $DXB_SHA"

      - name: Stage riva XNU patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          # bazel "build" script expects patches in dxb/patches. We stage:
          #   * the riva-specific series (xnu/patches/*.patch)
          #   * the reusable ios-sweet patches shared into xnu/patches/reuse/
          #   * any stage-*.sh staging scripts
          mkdir -p dxb/patches
          declare -a PATCHES=( xnu/patches/*.patch xnu/patches/reuse/*.patch )
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "⚠️  no .patch files in xnu/patches/ -- nothing staged"
            echo "    the build will fail later because there is no riva config"
            echo "    run tools/stage-reuse-patches.sh and/or add 00NN-riva-*.patch"
          else
            cp -f xnu/patches/*.patch dxb/patches/ 2>/dev/null || true
            cp -f xnu/patches/reuse/*.patch dxb/patches/ 2>/dev/null || true
            cp -f xnu/patches/stage-*.sh dxb/patches/ 2>/dev/null || true
          fi
          echo "=== staged patches ==="
          ls dxb/patches | wc -l
          ls dxb/patches

      - name: Point build.sh at the riva arm64 kernel
        # libfirehose_kernel is arm64e-only; the RIVA kernel is plain arm64.
        run: |
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Install dependencies
        run: |
          brew install jq gum bash cmake ninja >/dev/null 2>&1 || true
          # build.sh only checks that `xcodes` exists; Xcode is preinstalled.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Verify riva patches apply cleanly (self-check)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Resolve the SAME xnu tag build.sh will clone (macos-135 branch ->
          # tag), clone it, apply our patches the SAME way (git apply --check
          # then git apply), and HARD FAIL if RIVA is not registered. This turns
          # the toolchain's silent "Skipping patch" into an explicit error.
          MACOS_BRANCH=$(echo "${MACOS_VERSION}" | tr -d '.' | sed 's/^/macos-/')
          RELEASE_URL="https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/${MACOS_BRANCH}/release.json"
          XNUTAG=$(curl -s "$RELEASE_URL" | jq -r '.projects[] | select(.project=="xnu") | .tag')
          echo "resolved xnu tag (from ${MACOS_BRANCH}): $XNUTAG"
          if [ ! -d xnu-selfcheck/xnu ]; then
            git clone -q --depth 1 --branch "$XNUTAG" \
              https://github.com/apple-oss-distributions/xnu.git xnu-selfcheck/xnu
          fi
          cd xnu-selfcheck/xnu
          echo "=== base SUPPORTED_ARM64_MACHINE_CONFIGS (before our patches) ==="
          grep -n "SUPPORTED_ARM64_MACHINE_CONFIGS = BCM2837" makedefs/MakeInc.def || echo "(not found)"
          for P in ../../xnu/patches/*.patch; do
            echo "--- checking patch: $P ---"
            if git apply --check "$P" 2>err.txt; then
              git apply "$P"
              echo "    applied OK"
            else
              echo "!!! git apply FAILED for $P :"
              cat err.txt
              exit 1
            fi
          done
          echo "=== SUPPORTED_ARM64_MACHINE_CONFIGS (after patches) ==="
          grep -n "SUPPORTED_ARM64_MACHINE_CONFIGS = BCM2837" makedefs/MakeInc.def || echo "(NOT FOUND)"
          if ! grep -q "RIVA" makedefs/MakeInc.def; then
            echo "!!! RIVA not registered in MakeInc.def after apply — aborting"
            exit 1
          fi
          echo "✓ RIVA registered — patches apply cleanly"

      - name: Build XNU for RIVA
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ 2>/dev/null || true
          # The build tree only exists if the compile step produced output.
          # Guard each source path so a (still-expected) build failure does
          # not turn into a confusing tar "Cannot stat" error.
          TAR_ARGS=()
          for p in "dxb/build/xnu.obj" "dxb/fakeroot/usr/local/include" "dxb/xnu"; do
            [ -e "$p" ] && TAR_ARGS+=("$p")
          done
          if [ "${#TAR_ARGS[@]}" -gt 0 ]; then
            tar czf buildtree.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' \
              --exclude='*.unstripped' --exclude='kernel.*.tmp' --exclude='.git' \
              -C dxb "${TAR_ARGS[@]}" \
              -C .. sdk-kernel-platform
            ls -la buildtree.tgz
          else
            echo "no build tree produced (build did not reach object output) -- skipping"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          # Guard: KDK is usually absent on public runners. If no KDK is
          # installed, skip silently instead of emitting a '*' filename that
          # upload-artifact would reject.
          shopt -s nullglob
          libs=( /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a )
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "no KDK libs found -- skipping"
            exit 0
          fi
          for lib in "${libs[@]}"; do
            b=$(basename "$lib" .a)
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel* 2>/dev/null > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      - name: Assemble riva shim payload (kernel + ADT + boot-args)
        if: always()
        run: |
          # Once we ship a kernel, bundle it with the ADT the way the shim
          # + flash flow expects. tools/mkpayload-riva.py does this; this step
          # just confirms the wiring.
          ls out/kernel* 2>/dev/null && echo "kernel present -> run tools/mkpayload-riva.py" || \
            echo "no kernel yet (expected until the RIVA patches produce one)"